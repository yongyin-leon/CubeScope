<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">CubeScope browser-native ENVI viewer architecture</title>
  <desc id="desc">Layered architecture diagram showing local and HTTP ENVI sources, byte access, ENVI parsing, worker runtime, cube services, renderers, and public viewer API.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#243447"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111820; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #4f5b66; }
      .band { fill: #f6f7f8; stroke: #cbd1d8; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #9aa7b5; stroke-width: 2; }
      .box-strong { fill: #edf7f3; stroke: #3c8d73; stroke-width: 3; }
      .box-gpu { fill: #eef4ff; stroke: #4b73c4; stroke-width: 3; }
      .box-api { fill: #fff7e8; stroke: #c47a28; stroke-width: 3; }
      .label { font: 700 26px Arial, sans-serif; fill: #111820; }
      .small { font: 400 20px Arial, sans-serif; fill: #53606c; }
      .lane { font: 700 22px Arial, sans-serif; fill: #53606c; text-transform: uppercase; letter-spacing: .5px; }
      .arrow { stroke: #243447; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #6f7d8a; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="960" fill="#ffffff"/>
  <text class="title" x="64" y="72">CubeScope architecture</text>
  <text class="subtitle" x="64" y="112">Browser-native ENVI viewing with local-first sources, worker runtime orchestration, and GPU-backed rendering</text>

  <rect class="band" x="56" y="156" width="1688" height="150" rx="8"/>
  <text class="lane" x="82" y="196">Sources</text>
  <rect class="box" x="210" y="190" width="310" height="86" rx="8"/>
  <text class="label" x="242" y="226">Local ENVI files</text>
  <text class="small" x="242" y="256">Header + image File/Blob</text>
  <rect class="box" x="620" y="190" width="340" height="86" rx="8"/>
  <text class="label" x="652" y="226">Remote ENVI</text>
  <text class="small" x="652" y="256">CORS + HTTP range reads</text>

  <rect class="band" x="56" y="340" width="1688" height="190" rx="8"/>
  <text class="lane" x="82" y="380">Data and format layer</text>
  <rect class="box" x="210" y="410" width="300" height="88" rx="8"/>
  <text class="label" x="242" y="446">DataSource</text>
  <text class="small" x="242" y="476">Byte access only</text>
  <rect class="box-strong" x="620" y="410" width="340" height="88" rx="8"/>
  <text class="label" x="652" y="446">Rust/WASM ENVI parser</text>
  <text class="small" x="652" y="476">Header, tiles, spectra</text>
  <rect class="box" x="1070" y="410" width="320" height="88" rx="8"/>
  <text class="label" x="1102" y="446">CubeStore</text>
  <text class="small" x="1102" y="476">Metadata + cube services</text>

  <rect class="band" x="56" y="564" width="1688" height="170" rx="8"/>
  <text class="lane" x="82" y="604">Runtime and rendering</text>
  <rect class="box-strong" x="210" y="626" width="350" height="82" rx="8"/>
  <text class="label" x="242" y="660">Viewer runtime</text>
  <text class="small" x="242" y="690">Events, lifecycle, stale-work guards</text>
  <rect class="box" x="665" y="626" width="310" height="82" rx="8"/>
  <text class="label" x="697" y="660">Web Worker</text>
  <text class="small" x="697" y="690">Background tile/stat work</text>
  <rect class="box-gpu" x="1080" y="626" width="370" height="82" rx="8"/>
  <text class="label" x="1112" y="660">Renderer</text>
  <text class="small" x="1112" y="690">WebGPU first, WebGL fallback</text>

  <rect class="band" x="56" y="768" width="1688" height="126" rx="8"/>
  <text class="lane" x="82" y="808">Public API and interaction</text>
  <rect class="box-api" x="210" y="820" width="330" height="54" rx="8"/>
  <text class="label" x="242" y="856">CubeViewer API</text>
  <rect class="box-api" x="650" y="820" width="330" height="54" rx="8"/>
  <text class="label" x="682" y="856">Band controls</text>
  <rect class="box-api" x="1090" y="820" width="330" height="54" rx="8"/>
  <text class="label" x="1122" y="856">Spectral + spatial probes</text>

  <path class="arrow" d="M365 276 L365 410"/>
  <path class="arrow" d="M790 276 L790 410"/>
  <path class="arrow" d="M510 454 L620 454"/>
  <path class="arrow" d="M960 454 L1070 454"/>
  <path class="arrow" d="M1230 498 C1230 560 480 560 385 626"/>
  <path class="arrow" d="M560 666 L665 666"/>
  <path class="arrow" d="M975 666 L1080 666"/>
  <path class="arrow" d="M1265 708 C1265 770 380 770 375 820"/>
  <path class="soft-arrow" d="M385 820 C385 755 385 730 385 708"/>
  <path class="soft-arrow" d="M815 820 C815 755 815 730 815 708"/>
  <path class="soft-arrow" d="M1255 820 C1255 755 1255 730 1265 708"/>
</svg>
