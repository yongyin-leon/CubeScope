[package]
name = "envi_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror = "1.0" # 用于创建优秀的错误类型
bimap = "0.6" # 用于数据类型和其ENVI代码的双向映射
once_cell = "1.19" # 用于创建静态的HashMap
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
[profile.release]
# 告诉 `rustc` 优化代码大小
opt-level = "s"